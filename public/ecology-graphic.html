<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gowanus Ecological Infographic</title>
	<link rel="stylesheet" href="ecology-graphic.css">
</head>
<body>
	<main class="ecology-graphic-main">
		<h1 class="ecology-title">Gowanus Ecological Zones</h1>
		<div class="ecology-graphic-frame">
			<svg id="ecology-graphic-svg"></svg>
			<div class="ecology-legend">
				<span class="legend-title">Legend</span>
				<span class="legend-item"><span class="legend-symbol legend-canopy"></span> Canopy Tree</span>
				<span class="legend-item"><span class="legend-symbol legend-shrub"></span> Shrub/Understory</span>
				<span class="legend-item"><span class="legend-symbol legend-pollinator"></span> Pollinator/Fauna</span>
			</div>
		</div>
		<div class="ecology-annotations">
			<span class="annotation">Wet Edge</span>
			<span class="annotation">Woodland Core</span>
			<span class="annotation">Pollinator Edge</span>
		</div>
	</main>
	<script src="ecology-graphic.js"></script>
</body>
</html>
