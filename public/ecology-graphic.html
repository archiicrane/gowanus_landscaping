<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gowanus Ecological Infographic</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@400;600;700&display=swap">
	<link rel="stylesheet" href="/ecology-graphic.css">
	<style>
		body { font-family: 'Barlow', sans-serif; }
		h1, h2, h3, h4, h5, h6 { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }
	</style>
</head>
<body>
	<main class="ecology-graphic-main">
		<h1 class="ecology-title">Gowanus Ecological Zones</h1>
		<div class="ecology-graphic-frame">
			<svg id="ecology-graphic-svg"></svg>
			<div class="ecology-legend">
				<span class="legend-title">Legend</span>
				<span class="legend-item"><span class="legend-symbol legend-canopy"></span> Canopy Tree</span>
				<span class="legend-item"><span class="legend-symbol legend-shrub"></span> Shrub &amp; Understory</span>
				<span class="legend-item"><span class="legend-symbol legend-pollinator"></span> Pollinator &amp; Fauna</span>
			</div>
		</div>
		<div class="ecology-annotations">
			<span class="annotation">Wet Edge</span>
			<span class="annotation">Woodland Core</span>
			<span class="annotation">Pollinator Edge</span>
		</div>
	</main>
	<script type="module" src="/ecology-graphic.js"></script>
</body>
</html>
