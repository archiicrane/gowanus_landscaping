
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Rewilding Gowanus</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Mapbox GL JS -->
	<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
	<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
	<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
	<nav class="top-bar">
		<span class="brand">Rewilding Gowanus</span>
		<span class="nav-links">
			<a href="/index.html" class="nav-btn active">Map</a>
			<a href="/site-plan.html" class="nav-btn">Site Strategy</a>
			<a href="/flora-diagram.html" class="nav-btn">Planting Research</a>
			<a href="/diagrams.html" class="nav-btn">Studies</a>
		</span>
	</nav>

	<div id="map"></div>

	<!-- Layer toggles -->
	<div id="layer-panel">
		<p class="layer-panel-title">Layers</p>
		<label class="layer-toggle">
			<input type="checkbox" id="toggle-buildings" checked />
			<span class="layer-dot" style="background:#9aa3ae"></span>
			<span>Buildings</span>
		</label>
		<label class="layer-toggle">
			<input type="checkbox" id="toggle-trees" checked />
			<span class="layer-dot" style="background:#7aab6e"></span>
			<span>Trees</span>
		</label>
		<label class="layer-toggle">
			<input type="checkbox" id="toggle-park" checked />
			<span class="layer-dot" style="background:#4e7e5a"></span>
			<span>Park / Site</span>
		</label>
	</div>

	<!-- Tree species legend -->
	<div id="legend"></div>

	<!-- Hover tooltip -->
	<div id="map-tooltip"></div>

	<script type="module" src="/js/main.js"></script>
</body>
</html>
