<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rewilding Gowanus - Drawings</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body.drawings-page {
      padding-top: 56px;
      background: transparent;
    }

    .drawings-layout {
      width: min(95vw, 1560px);
      margin: 20px auto 64px;
      display: grid;
      gap: 16px;
    }

    .drawings-panel {
      border: 1.5px solid var(--panel-glass-border);
      border-radius: var(--panel-glass-radius);
      background: var(--panel-glass-fill);
      box-shadow: 0 12px 28px rgba(32, 44, 38, 0.12);
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      padding: 20px;
    }

    .drawings-panel h1 {
      margin: 6px 0 8px;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.06;
      font-family: var(--font-display);
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .drawings-panel p {
      margin: 0;
      max-width: 86ch;
      color: var(--ink-muted);
      line-height: 1.68;
    }

    .kicker {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: #8d867c;
    }

    .observable-frame {
      border: 1px solid rgba(47, 42, 36, 0.14);
      border-radius: 12px;
      background: #f2eee7;
    }

    .observable-frame iframe {
      width: 100%;
      border: 0;
      display: block;
      background: #f2eee7;
    }

    /* Heights set by JS based on rendered width × aspect ratio */
  </style>
</head>
<body class="drawings-page">
  <nav class="top-bar">
    <span class="brand">Rewilding Gowanus</span>
    <span class="nav-links">
      <a href="/index.html" class="nav-btn">References</a>
      <a href="/preceedence.html" class="nav-btn">Precedents</a>
      <a href="/site-analysis.html" class="nav-btn">Site Analysis</a>
      <a href="/site-plan.html" class="nav-btn">Site Plan</a>
      <a href="/drawings.html" class="nav-btn active">Drawings</a>
      <a href="/diagrams.html" class="nav-btn">Diagrams</a>
      <a href="/flora-diagram.html" class="nav-btn">Flora</a>
      <a href="/wildlife-corridor.html" class="nav-btn">Wildlife</a>
    </span>
  </nav>

  <main class="drawings-layout">
    <section class="drawings-panel">
      <div class="observable-frame">
        <iframe
          id="frame-park"
          title="Gowanus Observable Drawing"
          allow="fullscreen"
          loading="eager"
          src="https://observablehq.com/embed/4f11dfdf7a715ebe@622?cells=viewof+view%2CbldgDrawing2&api_key=a179cd31f7162f6ef1777ec6d823ac4e7db1f771&banner=false"
          scrolling="no">
        </iframe>
      </div>
    </section>

    <section class="drawings-panel">
      <p class="kicker">Building Drawing</p>
      <div class="observable-frame">
        <iframe
          id="frame-bldg"
          title="Building Drawing"
          allow="fullscreen"
          loading="lazy"
          src="https://observablehq.com/embed/3b74ad909b2fe86e?cells=bldgDrawing&banner=false"
          scrolling="no">
        </iframe>
      </div>
    </section>

    <section class="drawings-panel">
      <p class="kicker">Soil Diagram</p>
      <div class="observable-frame">
        <iframe
          id="frame-soil"
          title="Soil Diagram"
          allow="fullscreen"
          loading="lazy"
          src="https://observablehq.com/embed/3b74ad909b2fe86e?cells=soilDiagram&banner=false"
          scrolling="no">
        </iframe>
      </div>
    </section>
  </main>
<script>
  // Each SVG uses viewBox so it scales to fill the iframe width.
  // Height = width × (viewBox h / viewBox w) + Observable cell padding.
  const FRAMES = [
    { id: 'frame-park', hRatio: 700 / 1000, extra: 90  }, // bldgDrawing2 + viewof controls
    { id: 'frame-bldg', hRatio: 1000 / 1000, extra: 60 }, // bldgDrawing square
    { id: 'frame-soil', hRatio: 500 / 700,  extra: 60  }, // soilDiagram
  ];

  function resizeFrames() {
    FRAMES.forEach(({ id, hRatio, extra }) => {
      const el = document.getElementById(id);
      if (!el) return;
      const w = el.offsetWidth;
      el.style.height = Math.round(w * hRatio + extra) + 'px';
    });
  }

  resizeFrames();
  window.addEventListener('resize', resizeFrames);
</script>
<script src="/mobile-nav.js"></script>
</body>
</html>
