DB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineMaterials(wetTrees,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','wetTrees')\n    polylineMaterials(woodlandTrees,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','woodlandTrees')\n    polylineMaterials(bushes,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','bushes')\n    polylineMaterials(bridges,'none','0.7','0.5','0.5','#3B3B3B','1 0','none','bridges')\n    staticText('General Overview',10,70,'Arial','14px','rgb(50,50,50)','700','start','parksText')\n    staticText('The Parks are areas of land that are used to develop an urban forest. The intent of this urban forest is to assist in controlling flooding while simultaneously providing habitat and food for the local fauna that stuggles to find such within the city.',10,90,'Arial','12px','rgb(50,50,50)','500','start','parksText')\n    svg.selectAll(\"text.parksText\")\n        .each(function() { wrap_text(d3.select(this), 400) });\n  }if(view == \"Wet Edge\"){\n    polyline(canal,'#4ABFD4','0.2','0.5','0.5','#4ABFD4','1 0','none','canal')\n    polyline(paths,'none','0.7','0.5','0.5','#DBDCDB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineMaterials(wetTrees,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','wetTrees')\n    staticText('Wet Edge Band',10,70,'Arial','14px','rgb(50,50,50)','700','start','wetText')\n    staticText('Contents: Sweetgum, Bald Cypress ',10,90,'Arial','12px','rgb(50,50,50)','500','start','wetText')\n    staticText('The Wet Edge consists of trees that can withstand wet conditions and high quantities of water. Their purpose os to take in the excess water that could possibly cause flooding of the Gowanus Canal before it reaches the canal.',10,120,'Arial','12px','rgb(50,50,50)','500','start','wetText')\n     svg.selectAll(\"text.wetText\")\n        .each(function() { wrap_text(d3.select(this), 400) });\n  }if(view == \"Woodland Core\"){\n    polyline(canal,'#4ABFD4','0.2','0.5','0.5','#4ABFD4','1 0','none','canal')\n    polyline(paths,'none','0.7','0.5','0.5','#DBDCDB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineMaterials(woodlandTrees,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','woodlandTrees')\n    staticText('Woodland Core Band',10,70,'Arial','14px','rgb(50,50,50)','700','start','woodlandText')\n    staticText('Contents: Serviceberry, Sweetgum, Hackberry, Northern Red Oak ',10,90,'Arial','12px','rgb(50,50,50)','500','start','woodlandText')\n      staticText('The Woodland Core consists of trees that provide habitat and food for the fauna within the forest. It primarily serves birds and mammals.',10,120,'Arial','12px','rgb(50,50,50)','500','start','woodlandText')\n    staticText('Fauna: American Robin, Northern Cardinal, Northern Mockingbird, Yellow Warbler, Baltimore Oriole, Northern Flicker, Cooper Hawk. Eastern Grey Squirrel, Eastern Chipmunk, Eastern Rabbit, White-Footed Mouse',10,165,'Arial','12px','rgb(50,50,50)','500','start','woodlandText')\n    svg.selectAll(\"text.woodlandText\")\n        .each(function() { wrap_text(d3.select(this), 400) });\n  }if(view == \"Pollinator Zones\"){\n    polyline(canal,'#4ABFD4','0.2','0.5','0.5','#4ABFD4','1 0','none','canal')\n    polyline(paths,'none','0.7','0.5','0.5','#DBDCDB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineMaterials(bushes,'none','0.8','0.5','0.5','#3B3B3B','1 0','none','bushes')\n    staticText('Pollinator Zones Band',10,70,'Arial','14px','rgb(50,50,50)','700','start','pollinatorText')\n    staticText('Contents: Nannyberry, Ferns, Virginia Bluebells, New York Aster, Wild Geraniums',10,90,'Arial','12px','rgb(50,50,50)','500','start','pollinatorText')\n    staticText('The Pollinator Zones consist of bushes and shrubs that serve to attract and provide habitat and food for pollinators.',10,120,'Arial','12px','rgb(50,50,50)','500','start','pollinatorText')\n    staticText('Pollinators: Honeybee, Monarch Butterfly',10,165,'Arial','12px','rgb(50,50,50)','500','start','pollinatorText')\n    svg.selectAll(\"text.pollinatorText\")\n        .each(function() { wrap_text(d3.select(this), 400) });\n  }if(view == \"Circulation\"){\n    polyline(canal,'#4ABFD4','0.2','0.5','0.5','#4ABFD4','1 0','none','canal')\n    polyline(paths,'none','0.7','0.5','0.5','#DBDCDB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineMaterials(bridges,'none','0.7','0.5','0.5','#3B3B3B','1 0','none','bridges')\n    polyline(circLine,'none','0','0.5','3','#A65C3D','1 0','none','circulation')\n    staticText('Circulation',10,70,'Arial','14px','rgb(50,50,50)','700','start','circText')\n    staticText('The circulation of the forest is fairly freeform. There are two bridges that allow for a connecting path betwwen the center park and the two parks on either end. Pedestrians are encourages to traverse the forest as they wish, using the bridges to get from park to park easily.',10,90,'Arial','12px','rgb(50,50,50)','500','start','circText')\n    svg.selectAll(\"text.circText\")\n        .each(function() { wrap_text(d3.select(this), 400) });\n  }if(view == \"Habitats\"){\n    polyline(canal,'#4ABFD4','0.2','0.5','0.5','#4ABFD4','1 0','none','canal')\n    polyline(paths,'none','0.7','0.5','0.5','#DBDCDB','1 0','none','paths')\n    polyline(pathStubborn,'none','1','0.5','0.5','grey','1 0','none','pathStubborn')\n    polyline(treeBands,'none','0.7','0.5','0.5','green','1 0','none','treeBands')\n    polylineCircles(habitats,'none','1','1','0.5','none','1 0','none','habitats')\n\n     // Butterfly Habitat Button\nsvg.append('rect')\n  .attr('class','butterflyHabitats')\n  .attr('x','50')\n  .attr(\"y\",'50')\n  .attr(\"rx\",'3')\n  .attr(\"ry\",'3')\n  .attr(\"width\",'24')\n  .attr(\"height\",'24')\n  .style(\"fill\",\"#F59127\")\n  .style(\"stroke-width\", \"2\") // Give it a visible thickness\n  .style(\"stroke\", fillColor({name: 'butterfly'})) // Matches the polyline color\n  .style(\"cursor\", \"pointer\") // Add cursor feedback\n  .on('pointerdown', (event) =\u003e habitatClick(event, { name: 'butterfly' })); // Explicitly pass the name\n\n// Burrow Habitat Button\nsvg.append('rect')\n  .attr('class','burrowHabitats')\n  .attr('x','50')\n  .attr(\"y\",'85')\n  .attr(\"rx\",'3')\n  .attr(\"ry\",'3')\n  .attr(\"width\",'24')\n  .attr(\"height\",'24')\n  .style(\"fill\",\"#7A3E00\")\n  .style(\"stroke-width\", \"2\")\n  .style(\"stroke\", fillColor({name: 'burrow'})) // Matches the polyline color\n  .style(\"cursor\", \"pointer\")\n  .on('pointerdown', (event) =\u003e habitatClick(event, { name: 'burrow' }));\n\n// Bath Habitat Button\nsvg.append('rect')\n  .attr('class','bathHabitats')\n  .attr('x','50')\n  .attr(\"y\",'120')\n  .attr(\"rx\",'3')\n  .attr(\"ry\",'3')\n  .attr(\"width\",'24')\n  .attr(\"height\",'24')\n  .style(\"fill\",\"#278EF5\")\n  .style(\"stroke-width\", \"2\")\n  .style(\"stroke\", fillColor({name: 'bath'})) // Matches the polyline color\n  .style(\"cursor\", \"pointer\")\n  .on('pointerdown', (event) =\u003e habitatClick(event, { name: 'bath' }));\n\n  staticText('Butterfly Habitats', 90, 67, 'Arial', '14px', 'rgb(50,50,50)', '700', 'start', 'butterflyText');\n  staticText('Burrow Habitats', 90, 102, 'Arial', '14px', 'rgb(50,50,50)', '700', 'start', 'burrowyText');\n  staticText('Bath Habitats', 90, 137, 'Arial', '14px', 'rgb(50,50,50)', '700', 'start', 'bathText');\n  }\n  \n  //lines from rhino\nfunction polyline(data, sfill, sOpac, sOpac2, sW, stroke, dash,tform,class2){\n\n  svg.selectAll('polyline.' + class2)\n    .data(data) \n    .enter() \n    .append('polyline')\n    .attr('class',function(d){return d.name + ' ' +class2})\n    .attr(\"points\", function(d){return d.pts}) \n    .attr('transform',tform)\n    .style(\"fill\", fillColor)\n    .style('fill-opacity',sOpac)\n    .style('stroke-opacity',sOpac2)\n    .style(\"stroke-width\", sW)\n    .style(\"stroke-dasharray\", dash)\n    .style(\"stroke\", stroke)\n}\n\n  function polylineMaterials(data, sFill, sOpac, sOpac2, sW, stroke, dash, tform, class2){\n\n  //svg.selectAll('polyline.' + class2)\n    p.enter().append('polyline')\n    .data(data) \n    .enter() \n    .append('polyline')\n    .attr('class',function(d){return d.name + ' ' + class2})\n    .attr(\"points\", function(d){return d.pts}) \n    .attr('transform',tform)\n    .style(\"fill\", fillColor)\n    .style('fill-opacity',sOpac)\n    .style('stroke-opacity',sOpac2)\n    .style(\"stroke-width\", sW)\n    .style(\"stroke-dasharray\", dash)\n    .style(\"stroke\", stroke)\n    //.on('pointerdown', materialClick)\n\n  }\n\n  function polylineCircles(data, sFill, sOpac, sOpac2, sW, stroke, dash, tform, class2){\n\n  //svg.selectAll('polyline.' + class2)\n    p.enter().append('polyline')\n    .data(data) \n    .enter() \n    .append('polyline')\n    .attr('class',function(d){return d.name + ' ' + class2})\n    .attr(\"points\", function(d){return d.pts}) \n    .attr('transform',tform)\n    .style(\"fill\", fillColor)\n    .style('fill-opacity',sOpac)\n    .style('stroke-opacity',sOpac2)\n    .style(\"stroke-width\", sW)\n    .style(\"stroke-dasharray\", dash)\n    .style(\"stroke\", stroke)\n    //.on('pointerdown', materialClick)\n\n  }\n\n  function materialClick(event, d){\n    svg.selectAll('polyline.wetTrees').style(\"stroke-width\", 0.5)\n    svg.selectAll('polyline.woodlandTrees').style(\"stroke-width\", 0.5)\n    svg.selectAll('polyline.bushes').style(\"stroke-width\", 0.5)\n    svg.selectAll('polyline.wetTrees').style(\"stroke-opacity\", 0.5)\n    svg.selectAll('polyline.woodlandTrees').style(\"stroke-opacity\", 0.5)\n    svg.selectAll('polyline.bushes').style(\"stroke-opacity\", 0.5)\n    svg.selectAll('polyline.wetTrees').style(\"fill-opacity\", 0.8)\n    svg.selectAll('polyline.woodlandTrees').style(\"fill-opacity\", 0.8)\n    svg.selectAll('polyline.bushes').style(\"fill-opacity\", 0.8)\n    svg.selectAll('polyline.wetTrees').style(\"stroke\",\"#3B3B3B\")\n    svg.selectAll('polyline.woodlandTrees').style(\"stroke\",\"#3B3B3B\")\n    svg.selectAll('polyline.bushes').style(\"stroke\",\"#3B3B3B\")\n    svg.selectAll('text.forestText').remove()\n\n    svg.selectAll('polyline.'+d.name).style(\"stroke-width\", 1)\n    svg.selectAll('polyline.'+d.name).style(\"stroke-opacity\", 1)\n    svg.selectAll('polyline.'+d.name).style(\"fill-opacity\", 1)\n    svg.selectAll('polyline.'+d.name).style(\"stroke\", \"black\")\n    \n    const curMaterial = forestInfo.find(p =\u003e p.id === d.name);\n    \n    if(curMaterial) {\n      staticText(curMaterial.name,10,70,'Arial','14px','rgb(50,50,50)','700','start','forestText')\n      staticText(curMaterial.info,10,90,'Arial','12px','rgb(50,50,50)','500','start','forestText')\n\n      var wrap = svg.selectAll(\"text.forestText\")\n      .each(function(d, i) { wrap_text(d3.select(this), 300) })\n    }\n  }\n\n  function fillColor(d){\n     var color = \"purple\"\n      if(d.name==\"canal\"){color = '#4ABFD4'}\n      if(d.name==\"parks\"){color = '#C3DEAB'}\n      if(d.name==\"pathsOuter\"){color = '#DBDCDB'}\n      if(d.name==\"pathsInner\"){color = '#C3DEAB'}\n      if(d.name==\"bridgeWalk\"){color = '#DBDCDB'}\n      if(d.name==\"bridgeBorders\"){color = '#68C4A1'}\n      if(d.name==\"bridgeSides\"){color = '#959795'}\n      if(d.name==\"wetEdge\"){color = '#68C4A1'}\n      if(d.name==\"woodlandCore\"){color = '#65973B'}\n      if(d.name==\"pollinatorZone\"){color = '#395421'}\n      if(d.name==\"baldCypress\"){color = '#84A992'}\n      if(d.name==\"sweetgum\"){color = '#B1C9BA'}\n      if(d.name==\"hackberry\"){color = '#AFDBBE'}\n      if(d.name==\"redOak\"){color = '#9FBCAA'}\n      if(d.name==\"serviceberry\"){color = '#6FBE89'}\n      if(d.name==\"redbud\"){color = '#567B64'}\n      if(d.name==\"redcedar\"){color = '#69967A'}\n      if(d.name==\"fern\"){color = '#75A34D'}\n      if(d.name==\"nannyberry\"){color = '#8CAD72'}\n      if(d.name==\"bluebells\"){color = '#DAE8CE'}\n      if(d.name==\"geraniums\"){color = '#ABCB90'}\n      if(d.name==\"nyAster\"){color = '#598036'}\n      if(d.name==\"bath\"){color = '#278EF5'}\n      if(d.name==\"burrow\"){color = '#7A3E00'}\n      if(d.name==\"butterfly\"){color = '#F59127'}\n     \n    return color\n  }\n\n  staticText('Layers of Forest',10,30,'Arial','16px','rgb(50,50,50)','1000','start','text')\n\n  function staticText(text,xVal,yVal,font,fSize,ffill,fWeight,fAnchor,textClass){\n  svg\n  .append('text')\n  .attr('class',textClass)\n  .attr('x',xVal)\n  .attr(\"y\",yVal)\n  .attr(\"font-size\",fSize)\n  .attr(\"font-family\",font)\n  .attr(\"font-weight\",fWeight)\n  .attr(\"text-anchor\",fAnchor)\n  .style('fill', ffill)\n  .text(text)  \n  }\n\n  // --- Auto-show info based on the selected View ---\n  let autoId = \"\";\n  if (view === \"Wet Edge\") autoId = \"wetEdge\";\n  if (view === \"Woodland Core\") autoId = \"woodlandCore\";\n  if (view === \"Pollinator Zones\") autoId = \"pollinatorZone\";\n\n  if (autoId) {\n    const viewData = forestInfo.find(p =\u003e p.id === autoId);\n    if (viewData) {\n      // Clear any existing text\n      svg.selectAll('text.forestText').remove();\n      \n      // Render the Title and Info for the zone\n      staticText(viewData.name, 10, 70, 'Arial', '14px', 'rgb(50,50,50)', '700', 'start', 'forestText');\n      staticText(viewData.info, 10, 90, 'Arial', '12px', 'rgb(50,50,50)', '500', 'start', 'forestText');\n\n      // Wrap the text\n      svg.selectAll(\"text.forestText\")\n        .each(function() { wrap_text(d3.select(this), 300) });\n        \n      // Optional: Highlight the specific zone polylines visually\n      svg.selectAll('polyline.' + autoId)\n        .style(\"stroke-width\", 1)\n        .style(\"stroke-opacity\", 1)\n        .style(\"stroke\", \"black\");\n    }\n  }\n\n  function habitatClick(event, d) {\n  // 1. Reset all habitats to a default low-visibility state\n  svg.selectAll('polyline.habitats')\n    .style(\"stroke-width\", 0.5)\n    .style(\"stroke-opacity\", 0.3)\n    .style(\"fill-opacity\", 0.3);\n\n  // 2. Highlight ONLY the polylines that match the clicked habitat name\n  // Note: This assumes your data objects in 'habitats' have a .name property \n  // like \"butterfly\", \"burrow\", or \"bath\"\n  svg.selectAll('polyline.' + d.name)\n    .style(\"stroke-width\", 2)\n    .style(\"stroke-opacity\", 1)\n    .style(\"fill\", fillColor)\n    .style(\"fill-opacity\", 1)\n    .raise(); // Optional: bring the selected elements to the front\n    \n   d3.select(event.currentTarget)\n    .style(\"stroke\", fillColor({name: d.name})) \n    .style(\"stroke-width\", \"4\");\n    //.style(\"stroke\", \"black\") // Optional: add a border to make it pop\n   \n}\n  \n\n  \n  return svg.node();\n}","pinned":true,"mode":"js","data":null,"name":null},{"id":5,"value":"viewof view = (Inputs.radio([\"Parks\", \"Wet Edge\", \"Woodland Core\", \"Pollinator Zones\", \"Circulation\", \"Habitats\"], {label: \"View\", value: \"Parks\"}));","pinned":true,"mode":"js","data":null,"name":null},{"id":191,"value":"canal = rhinoGraphics(canaltxt)","pinned":true,"mode":"js","data":null,"name":null},{"id":241,"value":"parksOutline = rhinoGraphics(parksOutlinetxt)","pinned":true,"mode":"js","data":null,"name":null},{"id":203,"value":"paths = rhinoGraphics(pathstxt)","pinned":true,"mode":"js","data":null,"name":null},{
