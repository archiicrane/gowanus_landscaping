<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rewilding Gowanus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="top-bar">
    <div class="brand">Rewilding Gowanus</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn active">Map</a>
      <a href="diagrams.html" class="nav-btn">Diagrams</a>
    </div>
  </nav>

  <div id="map"></div>

  <div class="layer-panel ui-panel" id="layer-panel">
    <label class="layer-toggle"><input type="checkbox" id="toggle-topo" checked /> <span>Topo</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-flood" checked /> <span>Flood</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-bioswale" checked /> <span>Bioswale</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-park" checked /> <span>Park</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-site" checked /> <span>Site</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-trees" /> <span>Trees</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-observable" /> <span>Drawing</span></label>
  </div>

  <div class="observable-overlay hidden" id="observable-overlay" aria-label="Observable drawing overlay">
    <iframe
      class="observable-frame"
      title="Observable drawing overlay"
      src="https://observablehq.com/embed/3b74ad909b2fe86e?cells=bldgDrawing&banner=false"
      loading="lazy"
      frameborder="0"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  <script src="trees.js"></script>
  <script src="main.js"></script>
</body>
</html>
