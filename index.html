  <div id="map"></div>

    <label for="mode-plan"><input type="radio" id="mode-plan" name="mode" value="plan" checked>Rendered Plan</label>

    <label class="layer-toggle"><input type="checkbox" id="toggle-trees" /> <span>Trees</span></label>
    <label class="layer-toggle"><input type="checkbox" id="toggle-observable" /> <span>Drawing</span></label>
  </div>
