<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewilding Gowanus</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jscastro76/threebox@master/dist/threebox.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-bar">
        <div class="brand">Rewilding Gowanus</div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn active">Map</a>
            <a href="diagrams.html" class="nav-btn">Diagrams</a>
        </div>
    </nav>

    <div id="map"></div>

    <div id="overlay-ui">
        <div id="stage-info" class="panel">
            <h2 id="stage-title">Gowanus Canal</h2>
            <p id="stage-text">The industrial heart of Brooklyn. Scroll to begin the story.</p>
        </div>

        <div id="stats-panel" class="panel">
            <h3>Gowanus Stats</h3>
            <div class="stat-item"><span>Tree Coverage</span><div class="bar"><div style="width: 15%"></div></div></div>
            <div class="stat-item"><span>Open Space</span><div class="bar"><div style="width: 8%"></div></div></div>
            <div class="stat-item"><span>Building Density</span><div class="bar"><div style="width: 75%"></div></div></div>
            <div class="stat-item"><span>Environmental Health</span><div class="bar"><div style="width: 40%"></div></div></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
